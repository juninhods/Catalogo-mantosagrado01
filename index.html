<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Camisas ⚽</title>
<link rel="icon" type="image/png" href="imagens/manto.png">


<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top, #0f2027, #000);
  color: #fff;
  text-align: center;
}

h1 { margin: 20px 0; }

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  padding: 20px;
}


.card, .shirt {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 15px;
  cursor: pointer;
  transition: 0.3s;
  animation: fadeIn 0.4s ease;
}

.card:hover, .shirt:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.18);
}


.card img {
  width: 70px;
  height: 70px;
  object-fit: contain;
  margin-bottom: 10px;
}

/* CAMISAS + ZOOM */
.zoom-container {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
}

.zoom-container img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  transition: transform 0.2s ease;
}

.zoom-container:hover img {
  transform: scale(2);
}


.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 999;
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  color: #fff;
  cursor: pointer;
}

.back {
  grid-column: 1 / -1;
  text-align: left;
  color: #00ffcc;
  cursor: pointer;
  font-weight: bold;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  background: #00ffcc;
  font-weight: bold;
  cursor: pointer;
}
.header-global {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 20px 0;
}

.logo-global {
  width: 80px;
  height: 80px;
  object-fit: contain;
  margin-bottom: 10px;
}


@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* =========================
   DESTAQUES + CARRINHO
========================= */
.section-title {
  grid-column: 1 / -1;
  margin: 10px 0 0;
  font-size: 22px;
}

.best-sellers {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  margin-top: 5px;
}

.best-sellers {
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 24px;
}

.best-sellers .zoom-container {
  height: 280px;
}

.best-sellers .zoom-container img {
  width: 100%;
  height: 280px;
  object-fit: cover;
}

.best-card {
  background: rgba(0,255,204,0.10);
  border: 1px solid rgba(0,255,204,0.35);
  border-radius: 16px;
  padding: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.best-card:hover {
  transform: scale(1.04);
  background: rgba(0,255,204,0.18);
}

.best-card img {
  width: 70px;
  height: 70px;
  object-fit: contain;
}

.cart-button {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 998;
  background: #00ffcc;
  color: #001b18;
  border: none;
  border-radius: 50px;
  padding: 13px 18px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 8px 25px rgba(0,0,0,0.45);
}

.cart-count {
  display: inline-flex;
  min-width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  margin-left: 5px;
  background: #000;
  color: #00ffcc;
  border-radius: 50%;
  font-size: 12px;
}

.cart-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 15px;
  box-sizing: border-box;
}

.cart-box {
  width: min(650px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #0b171a;
  border: 1px solid rgba(0,255,204,0.35);
  border-radius: 18px;
  padding: 20px;
  text-align: left;
  box-sizing: border-box;
}

.cart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.cart-header h2 {
  margin: 0;
}

.cart-close {
  background: transparent;
  color: #fff;
  font-size: 30px;
  padding: 0 8px;
  margin: 0;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.cart-item img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 8px;
}

.cart-item-info {
  flex: 1;
}

.cart-item-info h4 {
  margin: 0 0 5px;
}

.cart-item-info p {
  margin: 0;
  opacity: 0.8;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
}

.quantity button {
  margin: 0;
  padding: 4px 9px;
  border-radius: 7px;
}

.remove-item {
  background: #ff4d4d;
  color: #fff;
  padding: 7px 10px;
  margin: 0;
}

.cart-total {
  text-align: right;
  font-size: 20px;
  font-weight: bold;
  margin: 18px 0 10px;
}

.checkout {
  width: 100%;
  background: #25D366;
  color: #fff;
  font-size: 17px;
}

.empty-cart {
  text-align: center;
  padding: 35px 10px;
  opacity: 0.8;
}

@media (max-width: 600px) {
  .cart-button {
    right: 12px;
    bottom: 12px;
  }

  .cart-box {
    padding: 15px;
  }

  .cart-item {
    align-items: flex-start;
  }
}


.cookie-banner {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 20px;
  z-index: 1100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 16px 20px;
  background: #0b171a;
  color: #fff;
  border: 1px solid rgba(0,255,204,.35);
  border-radius: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
}
.cookie-banner p { margin: 5px 0 0; font-size: 13px; opacity: .85; }
.cookie-banner button { margin: 0; white-space: nowrap; }
@media (max-width: 600px) {
  .cookie-banner { flex-direction: column; align-items: stretch; left: 10px; right: 10px; bottom: 10px; }
}
</style>
</head>

<header class="header-global">

  <h1 id="title">Escolha o País</h1>
</header>

</button>

<div class="container" id="content"></div>


<div id="imageModal" class="modal" onclick="closeModal()">
  <span class="close">&times;</span>
  <img id="modalImg">
</div>


<div id="cartModal" class="cart-modal" onclick="closeCartOutside(event)">
  <div class="cart-box">
    <div class="cart-header">

  </div>
</div>

const content = document.getElementById("content");
const title = document.getElementById("title");


const WHATSAPP_LOJA = "5513997970308";

let carrinho = JSON.parse(localStorage.getItem("mantoSagradoCarrinho")) || [];
carrinho = carrinho.map(item => ({
  ...item,
  preco: typeof item.preco === "number" ? item.preco : Number(String(item.preco).replace("R$", "").replace(/\./g, "").replace(",", ".").trim())
})).filter(item => Number.isFinite(item.preco));

/*
  Países em destaque.
  Você pode trocar a ordem ou adicionar/remover países.
*/
const camisasMaisVendidas = [
  { nome: "Corinthians Home 2026 (Torcedor)", preco: "R$ 150", img: "imagens/camisas/cor-home26.jpg" },
  { nome: "Flamengo Home 2026 (Torcedor)", preco: "R$ 130", img: "imagens/camisas/fla-home26.jpg" },
  { nome: "Palmeiras Home 2026 (Torcedor)", preco: "R$ 130", img: "imagens/camisas/pal-home26.jpg" },
  { nome: "Santos  CBJR (Torcedor)", preco: "R$ 150", img: "imagens/camisas/san-cbjr.jpg" },
  { nome: "Brasil Home 2026 (Torcedor)", preco: "R$ 130", img: "imagens/camisas/brasil-home26.jpg" },
  { nome: "São Paulo  Home 2026 (Torcedor)", preco: "R$ 130", img: "imagens/camisas/sp-home26.jpg" },
];

function salvarCarrinho() {
  localStorage.setItem("mantoSagradoCarrinho", JSON.stringify(carrinho));
  atualizarCarrinho();
}

function atualizarCarrinho() {
  const quantidade = carrinho.reduce((total, item) => total + item.quantidade, 0);
  document.getElementById("cartCount").innerText = quantidade;

  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  if (!carrinho.length) {
    cartItems.innerHTML = '<div class="empty-cart">Seu carrinho está vazio.</div>';
    cartTotal.innerText = "R$ 0,00";
    return;
  }

  cartItems.innerHTML = carrinho.map((item, index) => `
    <div class="cart-item">
      <img src="${item.img}" alt="${item.nome}">
      <div class="cart-item-info">
        <h4>${item.nome}</h4>
        <p>${formatarMoeda(item.preco)} cada</p>
        <div class="quantity">
          <button onclick="alterarQuantidade(${index}, -1)">−</button>
          <strong>${item.quantidade}</strong>
          <button onclick="alterarQuantidade(${index}, 1)">+</button>
        </div>
      </div>
      <strong>${formatarMoeda(item.preco * item.quantidade)}</strong>
      <button class="remove-item" onclick="removerDoCarrinho(${index})">🗑</button>
    </div>
  `).join("");

  const total = carrinho.reduce(
    (soma, item) => soma + item.preco * item.quantidade, 0
  );

  cartTotal.innerText = formatarMoeda(total);
}

function formatarMoeda(valor) {
  return valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function adicionarAoCarrinho(nome, preco, img) {
  preco = typeof preco === "number" ? preco : Number(String(preco).replace("R$", "").replace(/\./g, "").replace(",", ".").trim());
  if (!Number.isFinite(preco)) {
    alert("Não foi possível identificar o preço desta camisa.");
    return;
  }

  const existente = carrinho.find(item => item.nome === nome);

  if (existente) {
    existente.quantidade++;
  } else {
    carrinho.push({
      nome,
      preco,
      img,
      quantidade: 1
    });
  }

  salvarCarrinho();
  alert("Camisa adicionada ao carrinho! 🛒");
}

function alterarQuantidade(index, valor) {
  carrinho[index].quantidade += valor;

  if (carrinho[index].quantidade <= 0) {
    carrinho.splice(index, 1);
  }

  salvarCarrinho();
  atualizarCarrinho();
}

function removerDoCarrinho(index) {
  carrinho.splice(index, 1);
  salvarCarrinho();
  atualizarCarrinho();
}

function openCart() {
  atualizarCarrinho();
  document.getElementById("cartModal").style.display = "flex";
}

function closeCart() {
  document.getElementById("cartModal").style.display = "none";
}

function closeCartOutside(event) {
  if (event.target.id === "cartModal") {
    closeCart();
  }
}
function finalizarPedido() {
  if (!carrinho.length) {
    alert("Adicione pelo menos uma camisa ao carrinho.");
    return;
  }

  const total = carrinho.reduce(
    (soma, item) => soma + item.preco * item.quantidade, 0
  );

  let mensagem = "Olá! Quero fazer um pedido pelo catálogo da Manto Sagrado.\n\n";

  carrinho.forEach(item => {
    mensagem += `*Item:* ${item.nome}\n`;
    mensagem += `*Quantidade:* ${item.quantidade}\n`;
    mensagem += `*Valor:* ${formatarMoeda(item.preco * item.quantidade)}\n\n`;
  });

  mensagem += `*Total do pedido:* ${formatarMoeda(total)}\n\n`;
  mensagem += "Gostaria de confirmar o pedido e combinar os detalhes de pagamento e entrega.";

  // encodeURIComponent ajusta os espaços e quebras de linha para o link de forma limpa
  const urlWhatsApp = `https://wa.me/${5513997970308}?text=${encodeURIComponent(mensagem)}`;

  window.open(urlWhatsApp, "_blank");
}

  const tituloDestaques = document.createElement("div");

      <button onclick='event.stopPropagation(); adicionarAoCarrinho(${JSON.stringify(camisa.nome)}, ${precoNumerico}, ${JSON.stringify(camisa.img)})'>Adicionar ao carrinho</button>
    `;
    destaques.appendChild(div);
  });

  content.appendChild(destaques);

}

function showLigas(pais) {
  title.innerText = pais + " – Ligas";
  content.innerHTML = `<div class="back" onclick="showPaises()">⬅ Voltar</div>`;

  Object.keys(data[pais].ligas).forEach(liga => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${data[pais].ligas[liga].img}" alt="${liga}"><h3>${liga}</h3>`;
    div.onclick = () => showTimes(pais, liga);
    content.appendChild(div);
  });
}

function showTimes(pais, liga) {
  title.innerText = liga + " – Times";
  content.innerHTML = `<div class="back" onclick="showLigas('${pais}')">⬅ Voltar</div>`;

  Object.keys(data[pais].ligas[liga].times).forEach(time => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${data[pais].ligas[liga].times[time].img}" alt="${time}"><h3>${time}</h3>`;
    div.onclick = () => showCamisas(pais, liga, time);
    content.appendChild(div);
  });
}

function showCamisas(pais, liga, time) {
  title.innerText = time + " – Camisas";
  content.innerHTML = `<div class="back" onclick="showTimes('${pais}','${liga}')">⬅ Voltar</div>`;

  data[pais].ligas[liga].times[time].camisas.forEach(camisa => {
    const precoNumerico = Number(
      String(camisa.preco).replace("R$", "").replace(/\./g, "").replace(",", ".").trim()
    );

    const div = document.createElement("div");
    div.className = "shirt";

    div.innerHTML = `
      <div class="zoom-container" onclick="openModal('${camisa.img}')">
        <img src="${camisa.img}" alt="${camisa.nome}">
      </div>
      <h3>${camisa.nome}</h3>
      <p>${camisa.preco}</p>
      <button onclick='adicionarAoCarrinho(${JSON.stringify(camisa.nome)}, ${precoNumerico}, ${JSON.stringify(camisa.img)})'>
        Adicionar ao carrinho
      </button>
    `;

    content.appendChild(div);
  });
}

  document.getElementById("imageModal").style.display = "flex";
  document.getElementById("modalImg").src = img;
}

function closeModal() {

}

showPaises();
atualizarCarrinho();
